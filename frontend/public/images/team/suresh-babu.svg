<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161926" />
      <stop offset="50%" stop-color="#1E2235" />
      <stop offset="100%" stop-color="#10121C" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28B32" />
      <stop offset="100%" stop-color="#7655E8" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F28B32" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7655E8" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="32" fill="url(#bg)" />
  
  <!-- Subtle decorative grid elements -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#brand)" stroke-width="2" opacity="0.2" />
  
  <!-- Central Badge Backing -->
  <circle cx="200" cy="200" r="85" fill="#161926" stroke="url(#brand)" stroke-width="3" />
  
  <!-- Monogram Initials "SB" -->
  <text x="200" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">SB</text>
  
  <!-- Bottom Corner Brand Accent Line -->
  <rect x="140" y="320" width="120" height="4" rx="2" fill="url(#brand)" />
</svg>

